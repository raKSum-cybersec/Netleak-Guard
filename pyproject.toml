[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netleak-guard"
version = "0.1.0"
description = "A CLI tool for monitoring, limiting, and preventing digital footprinting and network leakage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "raKSum" },
    { name = "Gemini (AI Collaborator)" }
]
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
netleak = "netleak.cli:main"